name: Release

# Triggered by the commit message, not by a tag. The SUBJECT line of the last
# commit in a push must start with:
#
#     release: extension<separator><optional summary>
#
# Case-insensitive, with optional spaces around the colon. The separator is
# ';', ':', '-', an en or em dash, or plain whitespace, so all of these work:
#
#     Release: extension;
#     release:extension; fix torn-off tab geometry
#     release: extension - fix torn-off tab geometry
#     release:extension fix torn-off tab geometry
#
# Text after the separator becomes the summary line of the release notes.
# Deliberately NOT matched: 'release: extensions', 'prerelease: extension',
# 'chore: release extension', and the word anywhere but the start of the
# subject. A merge commit ('Merge pull request ...') never matches, so merging
# a pull request does not release by accident.
#
# 'extension' is the target, leaving room for other targets later without a
# second workflow. head_commit is the LAST commit of a push, so the release
# commit has to be the final one — push it on its own if in doubt.
#
# workflow_dispatch is the escape hatch: a commit-message trigger otherwise
# needs an empty commit to re-run.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      summary:
        description: "One-line summary for the release notes"
        required: false
        default: ""

permissions:
  contents: write

# Two pushes in quick succession would otherwise race on tag creation, and the
# loser fails after having already built.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Expressions have no regex, so the trigger is parsed in a step. Every push
  # to master runs this job for a few seconds; the release job below only
  # runs when it says so.
  trigger:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.parse.outputs.release }}
      summary: ${{ steps.parse.outputs.summary }}
    steps:
      - name: Parse the release trigger
        id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Passed through the environment, never interpolated into the
          # script: a commit message is untrusted text.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DISPATCH_SUMMARY: ${{ inputs.summary }}
        run: |
          python3 - <<'PY'
          import os, re, secrets

          # Keep in sync with the comment at the top of this file.
          PATTERN = re.compile(
              r'^\s*release\s*:\s*extension(?:\s*[;:\u2013\u2014-]\s*|\s+|$)(?P<summary>.*)$',
              re.IGNORECASE)

          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              release, summary = True, os.environ.get('DISPATCH_SUMMARY', '').strip()
          else:
              msg = os.environ.get('COMMIT_MESSAGE', '')
              subject = msg.splitlines()[0] if msg else ''
              m = PATTERN.match(subject)
              release = bool(m)
              summary = m.group('summary').strip() if m else ''
              print(f"Subject: {subject!r}")

          print(f"Release: {release}" + (f", summary: {summary!r}" if summary else ""))
          delim = 'EOF_' + secrets.token_hex(8)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"release={'true' if release else 'false'}\n")
              fh.write(f"summary<<{delim}\n{summary}\n{delim}\n")
          PY

  release:
    needs: trigger
    if: needs.trigger.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are needed for the duplicate-tag guard

      # glib-compile-schemas lives in libglib2.0-bin; msgfmt in gettext.
      # Both are mandatory here: build.py --strict fails rather than falling
      # back, so a release can never ship a stale or missing gschemas.compiled.
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libglib2.0-bin gettext

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read version from metadata.json
        id: meta
        run: |
          VERSION_NAME=$(python3 -c "import json;print(json.load(open('metadata.json'))['version-name'])")
          VERSION=$(python3 -c "import json;print(json.load(open('metadata.json'))['version'])")
          UUID=$(python3 -c "import json;print(json.load(open('metadata.json'))['uuid'])")
          NAME=$(python3 -c "import json;print(json.load(open('metadata.json'))['name'])")
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "uuid=$UUID"                 >> "$GITHUB_OUTPUT"
          echo "name=$NAME"                 >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME"         >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME $VERSION_NAME (build $VERSION) as v$VERSION_NAME"

      # The highest-value gate: catches "forgot to bump metadata.json" before
      # anything is published, which is the mistake most likely to happen.
      - name: Refuse to reuse a tag
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.meta.outputs.tag }}" >/dev/null; then
            echo "::error::Tag ${{ steps.meta.outputs.tag }} already exists. Bump 'version' and 'version-name' in metadata.json."
            exit 1
          fi

      - name: Extract release notes from Changelog.md
        id: notes
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          meta = json.load(open('metadata.json'))
          vn, v = meta['version-name'], meta['version']

          text = open('Changelog.md', encoding='utf-8').read()
          # Headings look like: ## 26.08.31.89 (version 138) — title
          pattern = re.compile(r'^##\s+' + re.escape(vn) + r'\s*\(version\s+' + str(v) + r'\)(.*?)$',
                               re.MULTILINE)
          m = pattern.search(text)
          if not m:
              print(f"::error::No Changelog.md section for {vn} (version {v}). "
                    f"Every release needs an entry.")
              sys.exit(1)

          start = m.end()
          nxt = re.compile(r'^##\s', re.MULTILINE).search(text, start)
          body = text[start:nxt.start() if nxt else len(text)].strip()

          summary = os.environ.get('RELEASE_SUMMARY', '').strip()
          out = (f"{summary}\n\n---\n\n{body}" if summary else body)

          # OUTSIDE the repo: build.py packages the working tree, so a notes
          # file left in it ends up inside the extension zip.
          dest = os.path.join(os.environ['RUNNER_TEMP'], 'RELEASE_NOTES.md')
          with open(dest, 'w', encoding='utf-8') as fh:
              fh.write(out + "\n")
          print(f"Release notes: {len(out)} chars from the {vn} section")
          PY
        env:
          # Parsed by the trigger job: the text after the trigger prefix, or
          # the workflow_dispatch input.
          RELEASE_SUMMARY: ${{ needs.trigger.outputs.summary }}

      - name: Verify sources
        run: |
          fail=0
          for f in $(find app extension.js prefs.js app.js -name '*.js' | sort); do
            node --input-type=module --check < "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done
          node check-symbols.js || fail=1
          exit $fail

      # Only the EGO package is produced. It is the same tree users need, and
      # building one artefact means the zip attached here is byte-for-byte the
      # one submitted to extensions.gnome.org rather than a sibling of it.
      - name: Build package
        run: |
          python3 build.py --strict --ego
          ls -la tmp/

      # Each of these corresponds to something that has actually gone wrong
      # in this project before.
      - name: Verify packages
        run: |
          python3 - <<'PY'
          import glob, json, sys, zipfile

          # Bump when a new GNOME Shell major is actually released. Declaring an
          # unreleased version is an EGO review rejection.
          LATEST_RELEASED_SHELL = 50

          meta = json.load(open('metadata.json'))
          problems = []

          zips = sorted(glob.glob('tmp/*.zip'))
          if len(zips) != 1:
              problems.append(f"expected exactly one package, found {zips}")

          for path in zips:
              zf = zipfile.ZipFile(path)
              names = set(zf.namelist())

              if 'schemas/gschemas.compiled' not in names:
                  problems.append(f"{path}: gschemas.compiled missing (preferences would not open)")
              if not any(n.endswith('.mo') for n in names):
                  problems.append(f"{path}: no compiled catalogs (interface would be English only)")
              if 'metadata.json' not in names:
                  problems.append(f"{path}: metadata.json missing")
              if 'app.js' in names:
                  problems.append(f"{path}: app.js must not ship (self-executing dev harness)")

              dead = [n for n in names if '.v0' in n or '.v1' in n]
              if dead:
                  problems.append(f"{path}: dead-code files present: {dead}")

              if 'metadata.json' in names:
                  raw = json.loads(zf.read('metadata.json'))
                  # --ego strips metadata to EGO's own schema. about.js reads
                  # both of these directly, so stripping them blanks the
                  # developer label and removes the Documentation group.
                  for key in ('links', 'developer-name'):
                      if key not in raw:
                          problems.append(f"{path}: '{key}' stripped; about.js reads it directly")
                  for key in ('uuid', 'settings-schema', 'version', 'version-name'):
                      if key not in raw:
                          problems.append(f"{path}: '{key}' missing from packaged metadata")
                  if raw.get('uuid') != meta['uuid']:
                      problems.append(f"{path}: packaged uuid {raw.get('uuid')!r} != {meta['uuid']!r}")

          unreleased = [v for v in meta['shell-version'] if int(v) > LATEST_RELEASED_SHELL]
          if unreleased:
              problems.append(
                  f"metadata.json: shell-version lists unreleased {unreleased}; "
                  f"raise LATEST_RELEASED_SHELL here once it ships")

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print(f"Verified {zips[0]}")
          PY

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "v${{ steps.meta.outputs.version_name }} (build ${{ steps.meta.outputs.version }})" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" \
            tmp/hornbill@lethil.me.shell-extension.zip
